server:
  port: 8080

spring:
  application:
    name: yiyang-platform
  datasource:
    url: jdbc:mysql://localhost:3306/yiyang_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.cdut.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: hwadee-yiyang-platform-secret-key-2026-9d8f7a6b5c4e
  expire: 7200          # accessToken 有效期(秒)
  refresh-expire: 1209600  # refreshToken 有效期(秒)

# 文件上传目录(Excel 导入导出)
file:
  upload-dir: ./uploads
