# ==================== 服务端口 ====================
server.port=8080

# ==================== 数据源 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/yiyang_platform?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis ====================
# XML 映射文件位置
mybatis.mapper-locations=classpath*:mapper/*.xml
# 开启驼峰命名映射：create_time -> createTime
mybatis.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL（联调完可以关掉）
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== JWT ====================
# 注意：密钥长度必须 >= 32 字节（HS256 要求）
jwt.secret=yiyang-elder-platform-jwt-secret-key-please-change-me
jwt.expire=7200
