
spring.datasource.url=jdbc:mysql://localhost:3306/yiyang_platform?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath*:mapper/*.xml

mybatis.configuration.map-underscore-to-camel-case=true

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== JWT ====================
# 注意：密钥长度必须 >= 32 字节（HS256 要求）
jwt.secret=yiyang-elder-platform-jwt-secret-key-please-change-me
jwt.expire=7200
pagehelper:
helper-dialect: mysql          # 数据库方言：mysql / oracle / postgresql / sqlserver 等
reasonable: true               # 页码 <=0 时查第 1 页，超过最大页时查最后一页
support-methods-arguments: true # 支持通过 Mapper 方法参数传递分页参数
params: count=countSql         # 默认 count 查询配置，一般不改
page-size-zero: false          # pageSize=0 时是否查出所有记录
